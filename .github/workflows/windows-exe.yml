name: Build Windows app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: ./Build-Windows-Exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DQXI-English-Translation-Builder-Windows
          path: |
            dist/DQXI-English-Translation-Builder.exe
            README.md
            LICENSE
            licenses/
