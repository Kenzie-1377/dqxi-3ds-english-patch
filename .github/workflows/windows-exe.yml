name: Build Windows app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./Build-Windows-Exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DQXI-English-Translation-Builder-Windows
          path: |
            dist/DQXI-English-Translation-Builder.exe
            README.md
            LICENSE
            licenses/
